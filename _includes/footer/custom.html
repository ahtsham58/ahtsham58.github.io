<!-- Dark-mode toggle: flips data-theme on <html> and remembers the choice -->
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var icon = btn.querySelector('.theme-toggle__icon');

    function paint(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      if (icon) icon.textContent = mode === 'dark' ? '☀️' : '🌙';
      try { localStorage.setItem('theme', mode); } catch (e) {}
    }

    // Sync the icon with whatever the head script already applied.
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    if (icon) icon.textContent = current === 'dark' ? '☀️' : '🌙';

    btn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      paint(next);
    });
  })();
</script>

<!-- end custom footer snippets -->
