<script src="{{ base_path }}/assets/js/main.min.js"></script>

<!-- Re-bind smooth scroll with a larger offset so in-page anchors clear the
     sticky masthead. Runs after main.min.js, so it replaces the theme's -20. -->
<script>
  window.jQuery && jQuery(function ($) {
    if ($.fn.smoothScroll) {
      $('a[href*="#"]').smoothScroll({ offset: -90 });
    }
  });
</script>
